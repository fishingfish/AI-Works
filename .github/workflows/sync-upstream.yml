name: Sync upstream

on:
  schedule:
    - cron: "17 3 * * 1"   # 每周一 UTC 03:17
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/LingJingMaster/Shadowrocket-Rules.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date"; exit 0
          fi
          BR="sync/upstream-$(date +%Y%m%d)"
          git checkout -b "$BR"
          if git merge upstream/main -m "Sync upstream LingJingMaster/Shadowrocket-Rules"; then
            BODY="上游更新已自动合并，无冲突。检查后合并即可。"
          else
            if [ -z "$(git ls-files -u)" ]; then echo "merge failed without conflicts"; exit 1; fi
            # 保留冲突标记原样提交，绝不自动选边，避免覆盖个人修改
            git add -A
            git commit -m "Sync upstream (HAS CONFLICT MARKERS - resolve before merging)"
            FILES=$(git grep -l -E '^(<<<<<<<|>>>>>>>) ' -- . ':!.github' | sed 's/^/- /')
            BODY=$(printf '%s\n\n%s\n%s' "⚠️ 与你的个性化修改存在冲突，请勿直接合并。下列文件含冲突标记（<<<<<<< / >>>>>>>），请在 PR 里逐处解决，保留你的自定义后再合并：" "" "$FILES")
          fi
          git push origin "$BR"
          gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BR" \
            --title "Sync upstream $(date +%F)" --body "$BODY"
